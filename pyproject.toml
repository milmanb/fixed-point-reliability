[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fpr"
version = "1.0.0"
description = "Stable but Wrong: fixed-point residuals as reference-free reliability signals for image restoration (MCV final project)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Itay Shorian"},
    {name = "Michael Bazkor"},
    {name = "Boaz Cohen"},
    {name = "Bar Milman"},
    {name = "Assaf Fleischer"},
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",          # older torch works only with numpy < 2
    "torchvision>=0.19",
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.2",         # groupby.apply(include_groups=...)
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/milmanb/fixed-point-reliability"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
