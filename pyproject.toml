[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fpr"
version = "0.1.0"
description = "Reference-free reliability signals for learned image projectors (MCV final project)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",          # older torch works only with numpy < 2
    "torchvision>=0.19",
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.2",         # groupby.apply(include_groups=...)
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
